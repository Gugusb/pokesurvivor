<script>
/* Original procedural diorama. No network, external assets, accounts or UI. */
(() => {
  'use strict';
  const T = window.LEAGUE_ENGINE;
  const canvas = document.querySelector('canvas');
  const renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .94;
  const scene = new T.Scene();
  scene.background = new T.Color('#c9dce3');
  const camera = new T.PerspectiveCamera(34,1,0.1,180);
  const model = new T.Group(); scene.add(model);
  const parkObstacles=[];
  const palette = {stone:'#f1e9d3',light:'#fff4da',shade:'#c1caca',ink:'#3b5365',gold:'#ceaa5c',goldLight:'#ffe3a0',roof:'#47878f',roofDark:'#325f75',blue:'#427fa1',red:'#ba5369',grass:'#89b68d',leaf:'#5d967d',wood:'#705964',dark:'#36455c'};
  const gradient = new T.DataTexture(new Uint8Array([90,155,208,255]),4,1,T.RedFormat);
  gradient.needsUpdate=true; gradient.minFilter=T.NearestFilter; gradient.magFilter=T.NearestFilter;
  const mats=new Map(), buckets=new Map(), outlines=[];
  function mat(c){if(!mats.has(c))mats.set(c,new T.MeshToonMaterial({color:c,gradientMap:gradient}));return mats.get(c);}
  const ink=new T.LineBasicMaterial({color:palette.ink,transparent:true,opacity:.36});
  let seed=25817;
  function rand(){seed=(seed*1664525+1013904223)>>>0; return seed/4294967296;}
  function put(g,c,x=0,y=0,z=0,rot=null,edge=false,parent=null){
    const m=new T.Mesh(g,typeof c==='string'?mat(c):c);m.position.set(x,y,z);if(rot)m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;
    if(parent){parent.add(m);return m;}
    m.updateMatrix();const baked=g.clone().applyMatrix4(m.matrix);
    const key=m.material.uuid;if(!buckets.has(key))buckets.set(key,{material:m.material,gs:[]});buckets.get(key).gs.push(baked);
    if(edge){const eg=new T.EdgesGeometry(g,28);eg.applyMatrix4(m.matrix);outlines.push(eg);}
    return m;
  }
  const box=(w,h,d,c,x,y,z,edge=true,parent=null,rot=null)=>put(new T.BoxGeometry(w,h,d),c,x,y,z,rot,edge,parent);
  const cyl=(rt,rb,h,c,x,y,z,n=16,parent=null,rot=null)=>put(new T.CylinderGeometry(rt,rb,h,n),c,x,y,z,rot,false,parent);
  const ball=(r,c,x,y,z,parent=null)=>put(new T.SphereGeometry(r,16,10),c,x,y,z,null,false,parent);
  const ico=(r,c,x,y,z,parent=null,detail=1)=>put(new T.IcosahedronGeometry(r,detail),c,x,y,z,null,false,parent);
  function torus(r,t,c,x,y,z,rot=[0,0,0],parent=null){return put(new T.TorusGeometry(r,t,6,48),c,x,y,z,rot,false,parent);}
  function rod(a,b,r,c,parent=null){const v=new T.Vector3(...b).sub(new T.Vector3(...a));const g=new T.CylinderGeometry(r,r,v.length(),8);const q=new T.Quaternion().setFromUnitVectors(new T.Vector3(0,1,0),v.clone().normalize());g.applyQuaternion(q);return put(g,c,...a.map((p,i)=>(p+b[i])/2),null,false,parent);}
  function path(points,c,r=.035,parent=null){const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));return put(new T.TubeGeometry(curve,Math.max(12,points.length*5),r,5,false),c,0,0,0,null,false,parent);}
  function archShape(w,h){const s=new T.Shape(), r=w/2;s.moveTo(-r,0);s.lineTo(r,0);s.lineTo(r,h-r);s.absarc(0,h-r,r,0,Math.PI,false);s.lineTo(-r,0);return s;}
  function arch(w,h,d,c,x,y,z){return put(new T.ExtrudeGeometry(archShape(w,h),{depth:d,bevelEnabled:false,curveSegments:24}),c,x,y,z,null,true);}
